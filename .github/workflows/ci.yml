name: unitana-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - codex/development

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify docs
        run: ./docs/tools/verify_docs.sh

      - name: Verify release config
        run: ./tools/verify_release_config.sh

      - name: Install dependencies
        working-directory: app/unitana
        run: flutter pub get

      - name: Enforce formatting
        working-directory: app/unitana
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: app/unitana
        run: flutter analyze

      - name: Test
        working-directory: app/unitana
        run: flutter test
